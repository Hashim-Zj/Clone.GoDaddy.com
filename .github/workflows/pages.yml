# Publish the static UI clone to GitHub Pages.
#
# There is no build. index.html and style.css are served as-is, so the
# deploy is a straight copy of the repository root.
#
# The action versions below matter. The previous pins
# (checkout@v3, configure-pages@v2, upload-pages-artifact@v1,
# deploy-pages@v1) all failed: upload-pages-artifact@v1 depends on
# actions/upload-artifact@v3, which GitHub permanently disabled in 2024.
# Every run died with "This request has been automatically failed because
# it uses a deprecated version of actions/upload-artifact: v3", which is
# why this repository sat at a 404 while private (Pages needs a public
# repository on the Free plan) and again after being made public.

name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - "**"
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Lets the workflow enable Pages itself if it is ever switched
          # off, instead of failing on "Get Pages site failed".
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
